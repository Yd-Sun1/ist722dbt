    because items in the same order may be fulfilled by different sellers.
  columns:
  - name: seller_key
    description: 'Surrogate key (hash of the natural key). ''-1'' = unknown member. Source: Generated: dbt_utils.generate_surrogate_key([''seller_id'']).'
    data_type: varchar(32)
    data_tests:
    - unique
    - not_null
  - name: seller_id
    description: 'Natural (business) key of the seller (anonymized). Source: raw.sellers.seller_id'
    data_type: varchar(32)
    data_tests:
    - unique
    - not_null
  - name: seller_zip_code_prefix
    description: '5-character zip prefix. Source: LPAD(TRIM(raw.sellers.seller_zip_code_prefix), 5, ''0'')'
    data_type: char(5)
    data_tests:
    - not_null
  - name: seller_city
    description: 'City, normalized (lower case, trimmed, accents removed). Source: raw.sellers.seller_city'
    data_type: varchar(50)
    data_tests:
    - not_null
  - name: seller_state
    description: 'Two-letter state code. Source: UPPER(TRIM(raw.sellers.seller_state))'
    data_type: char(2)
    data_tests:
    - not_null
  - name: seller_region
    description: 'Brazilian macro-region. Hierarchy: region > state > city. Source: dbt seed: state -> region.'
    data_type: varchar(15)
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Norte
          - Nordeste
          - Centro-Oeste
          - Sudeste
          - Sul
          - Unknown
- name: dim_product
  description: Products sold on the marketplace. One row per product (raw.products), with category names flattened in (hierarchy
    Category > Product). The source has no product names, only name and description lengths.
  columns:
  - name: product_key
    description: 'Surrogate key (hash of the natural key). ''-1'' = unknown member. Source: Generated: dbt_utils.generate_surrogate_key([''product_id'']).'
    data_type: varchar(32)
    data_tests:
    - unique
    - not_null
  - name: product_id
    description: 'Natural (business) key of the product. Source: raw.products.product_id'
    data_type: varchar(32)
    data_tests:
    - unique
    - not_null
  - name: category_name_pt
    description: 'Category in Portuguese; ''unknown'' if NULL. Source: COALESCE(raw.products.product_category_name, ''unknown'')'
    data_type: varchar(60)
    data_tests:
    - not_null
  - name: category_name_en
    description: 'Category in English; ''Unknown'' if no category or no translation. Source: COALESCE(raw.category_translation.product_category_name_english,
      seed_category_override.name_en, ''Unknown'') via LEFT JOIN on product_category_name.'
    data_type: varchar(60)
    data_tests:
    - not_null
  - name: product_name_length
    description: 'Characters in the product name. Source: raw.products.product_name_lenght (renamed - source spelling).'
    data_type: int
  - name: product_description_length
    description: 'Characters in the product description. Source: raw.products.product_description_lenght (renamed - source
      spelling).'
    data_type: int
  - name: product_photos_qty
    description: 'Number of product photos. Source: raw.products.product_photos_qty'
    data_type: int
  - name: product_weight_g
    description: 'Weight in grams. Source: raw.products.product_weight_g'
    data_type: int
  - name: product_length_cm
    description: 'Length in cm. Source: raw.products.product_length_cm'
    data_type: int
  - name: product_height_cm
    description: 'Height in cm. Source: raw.products.product_height_cm'
    data_type: int
  - name: product_width_cm
    description: 'Width in cm. Source: raw.products.product_width_cm'
    data_type: int
  - name: product_volume_cm3
    description: 'Length x height x width; NULL if any dimension is NULL. Source: Derived: product_length_cm * product_height_cm
      * product_width_cm.'
    data_type: int
  - name: weight_band
    description: '''Under 500 g'' (< 500), ''500 g to under 2 kg'' (500 to < 2,000), ''2 kg to under 10 kg'' (2,000 to < 10,000),
      ''10 kg and over'' (>= 10,000), ''Unknown'' (NULL). Source: Derived: CASE on product_weight_g.'
    data_type: varchar(20)
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Under 500 g
          - 500 g to under 2 kg
          - 2 kg to under 10 kg
          - 10 kg and over
          - Unknown
- name: dim_geography
  description: Conformed location dimension. One row per 5-character zip prefix, built from the UNION of prefixes in geolocation,
    customers and sellers so every lookup succeeds. Role-played in facts as customer geography and seller geography.
  columns:
  - name: geography_key
    description: 'Surrogate key (hash of the natural key). ''-1'' = unknown member. Source: Generated: dbt_utils.generate_surrogate_key([''zip_code_prefix'']).'
    data_type: varchar(32)
    data_tests:
    - unique
    - not_null
  - name: zip_code_prefix
    description: 'Natural key: 5-character zip prefix. Source: LPAD(TRIM(zip), 5, ''0'') from geolocation, customers and sellers
      (UNION).'
    data_type: char(5)
    data_tests:
    - unique
    - not_null
  - name: city
    description: 'Most frequent normalized city for the prefix. Source: MODE(normalized geolocation_city) per prefix; if the
      prefix is not in geolocation, MODE of the customer/seller city.'
    data_type: varchar(50)
    data_tests:
    - not_null
  - name: state
    description: 'Two-letter state code. Source: MODE(geolocation_state) per prefix; fallback as for city.'
    data_type: char(2)
    data_tests:
    - not_null
  - name: region
    description: 'Brazilian macro-region. Hierarchy: region > state > city > zip prefix. Source: dbt seed: state -> region.'
    data_type: varchar(15)
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Norte
          - Nordeste
          - Centro-Oeste
          - Sudeste
          - Sul
          - Unknown
  - name: latitude
    description: 'Average latitude of points inside Brazil; NULL if none. Source: AVG(geolocation_lat) for points inside the
      bounding box.'
    data_type: number(9,6)
  - name: longitude
    description: 'Average longitude of points inside Brazil; NULL if none. Source: AVG(geolocation_lng) for points inside
      the bounding box.'
    data_type: number(9,6)
  - name: has_geolocation
    description: 'TRUE if the prefix exists in raw.geolocation. Source: Derived.'
    data_type: boolean
    data_tests:
    - not_null
- name: dim_order_status
  description: Order status as stored in the source (delivered, shipped, canceled, unavailable, invoiced, processing, created,
    approved). Lets every fact filter to delivered or non-canceled orders in the same way.
  columns:
  - name: order_status_key
    description: 'Surrogate key (hash of the natural key). ''-1'' = unknown member. Source: Generated: dbt_utils.generate_surrogate_key([''order_status'']).'
    data_type: varchar(32)
    data_tests:
    - unique
    - not_null
  - name: order_status_code
    description: 'Natural key as stored in the source. Source: DISTINCT raw.orders.order_status'
    data_type: varchar(20)
    data_tests:
    - unique
    - not_null
  - name: order_status_name
    description: 'Readable status name. Source: INITCAP(order_status_code)'
    data_type: varchar(30)
    data_tests:
    - not_null
  - name: is_delivered
    description: 'TRUE if status = ''delivered''. Source: Derived from order_status_code.'
    data_type: boolean
    data_tests:
    - not_null
  - name: is_canceled_or_unavailable
    description: 'TRUE for ''canceled'' or ''unavailable''. Source: Derived from order_status_code.'
    data_type: boolean
    data_tests:
    - not_null
- name: fact_order_items
  description: 'Fact type: Transaction. Grain: one row per item on an order (raw.order_items; key = order_id + order_item_id).
    Each row is one unit. Supports item sales value, units and freight by product, category, seller, customer, location and
    time. Includes all order statuses; filter with dim_order_status.'
  columns:
  - name: order_id
    description: 'Degenerate dimension: order number. Part of composite PK. Source: raw.order_items.order_id'
    data_type: varchar(32)
    data_tests:
    - not_null
  - name: order_item_id
    description: 'Degenerate dimension: item sequence within the order. Part of composite PK. Source: raw.order_items.order_item_id'
    data_type: int
    data_tests:
    - not_null
  - name: purchase_date_key
    description: 'Date the order was placed. Source: Lookup on CAST(raw.orders.order_purchase_timestamp AS date) (join orders
      on order_id).'
    data_type: int
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: shipping_limit_date_key
    description: 'Date by which the seller must hand the item to the carrier. Source: Lookup on CAST(raw.order_items.shipping_limit_date
      AS date).'
    data_type: int
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: customer_key
    description: 'Customer who placed the order. Source: raw.orders.customer_id -> raw.customers.customer_unique_id -> dim_customer.'
    data_type: varchar(32)
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: seller_key
    description: 'Seller who fulfilled the item. Source: Lookup on raw.order_items.seller_id.'
    data_type: varchar(32)
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_seller')
          field: seller_key
  - name: product_key
    description: 'Product sold. Source: Lookup on raw.order_items.product_id.'
    data_type: varchar(32)
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_product')
          field: product_key
  - name: customer_geography_key
    description: 'Customer location at time of order (role of dim_geography). Source: Lookup on LPAD(raw.customers.customer_zip_code_prefix,
      5, ''0'') for the order''s customer_id (location at time of order).'
    data_type: varchar(32)
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_geography')
          field: geography_key
  - name: seller_geography_key
    description: 'Seller location (role of dim_geography). Source: Lookup on LPAD(raw.sellers.seller_zip_code_prefix, 5, ''0'').'
    data_type: varchar(32)
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_geography')
          field: geography_key
  - name: order_status_key
    description: 'Status of the order the item belongs to. Source: Lookup on raw.orders.order_status.'
    data_type: varchar(32)
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_order_status')
          field: order_status_key
  - name: item_count
    description: 'Always 1; SUM gives units sold. Source: Constant 1 (no quantity column in source).'
    data_type: int
    data_tests:
    - not_null
  - name: price_amount
    description: 'Item price (BRL). Source: raw.order_items.price'
    data_type: number(12,2)
    data_tests:
    - not_null
  - name: freight_amount
    description: 'Freight value for this item (BRL); additive. Source: raw.order_items.freight_value'
    data_type: number(12,2)
    data_tests:
    - not_null
  - name: item_total_amount
    description: 'Price + freight (BRL). Source: Derived: price + freight_value.'
    data_type: number(12,2)
    data_tests:
    - not_null
  data_tests:
  - unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_id
        - order_item_id
