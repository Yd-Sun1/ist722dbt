# GENERATED by scripts/gen_schema_from_excel.py from design/Pathfinders_Olist_BusMatrix.xlsx - edit the script/Excel, then re-run.
version: 2
models:
- name: dim_date
  description: 'Calendar dimension. One row per calendar day from 2016-01-01 to 31 Dec of the year of the latest date in any
    source date column, plus two special members: -1 = Unknown or invalid date, -2 = Not yet occurred. Role-played by purchase,
    approved, delivered-to-carrier, delivered-to-customer, estimated delivery, shipping limit, review creation and review
    answer dates.'
  columns:
  - name: date_key
    description: 'Smart key yyyymmdd; -1 = Unknown or invalid; -2 = Not yet occurred. Source: Derived: YEAR*10000 + MONTH*100
      + DAY of full_date.'
    data_type: int
    data_tests:
    - unique
    - not_null
  - name: full_date
    description: 'Calendar date. -1 uses 1900-01-01; -2 uses 9999-12-31. Source: Generated: dbt_utils.date_spine.'
    data_type: date
    data_tests:
    - unique
    - not_null
  - name: date_member_type
    description: '''Calendar'', ''Unknown or invalid'' or ''Not yet occurred''. Source: Derived.'
    data_type: varchar(20)
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Calendar
          - Unknown or invalid
          - Not yet occurred
  - name: day_of_week_number
    description: '1 = Monday ... 7 = Sunday. Special members use 0 / ''Unknown''. Source: Derived: DAYOFWEEKISO(full_date).'
    data_type: tinyint
    data_tests:
    - not_null
  - name: day_name
    description: 'Weekday name. Special members use 0 / ''Unknown''. Source: Derived: DAYNAME(full_date).'
    data_type: varchar(10)
    data_tests:
    - not_null
  - name: day_of_month
    description: 'Day within the month. Special members use 0 / ''Unknown''. Source: Derived: DAY(full_date).'
    data_type: tinyint
    data_tests:
    - not_null
  - name: week_of_year
    description: 'ISO week number. Special members use 0 / ''Unknown''. Source: Derived: WEEKISO(full_date).'
    data_type: tinyint
    data_tests:
    - not_null
  - name: month_number
    description: 'Month 1-12. Special members use 0 / ''Unknown''. Source: Derived: MONTH(full_date).'
    data_type: tinyint
    data_tests:
    - not_null
  - name: month_name
    description: 'Month name. Special members use 0 / ''Unknown''. Source: Derived: MONTHNAME(full_date).'
    data_type: varchar(10)
    data_tests:
    - not_null
  - name: year_month
    description: 'Year and month, e.g. 2017-11. Special members use 0 / ''Unknown''. Source: Derived: TO_CHAR(full_date, ''YYYY-MM'').'
    data_type: varchar(7)
    data_tests:
    - not_null
  - name: quarter_number
    description: 'Quarter 1-4. Special members use 0 / ''Unknown''. Source: Derived: QUARTER(full_date).'
    data_type: tinyint
    data_tests:
    - not_null
  - name: year_number
    description: 'Four-digit year. Special members use 0 / ''Unknown''. Source: Derived: YEAR(full_date).'
    data_type: smallint
    data_tests:
    - not_null
  - name: is_weekend
    description: 'TRUE on Saturday or Sunday; FALSE for special members. Source: Derived from day_of_week_number.'
    data_type: boolean
    data_tests:
    - not_null
  - name: is_national_holiday
    description: 'TRUE on Brazilian federal national holidays for that year. Source: dbt seed built from the federal calendars
      for 2016-2019.'
    data_type: boolean
    data_tests:
    - not_null
  - name: is_optional_observance
    description: 'TRUE on federal pontos facultativos (optional observances), e.g. Carnival. Source: Same dbt seed, classified
      by the status published for each year.'
    data_type: boolean
    data_tests:
    - not_null
  - name: holiday_name
    description: 'Name of the holiday or observance; NULL on ordinary days. Source: Same dbt seed.'
    data_type: varchar(50)
- name: dim_customer
  description: 'Customers who place orders. One row per customer_unique_id (the same customer across orders); customer_id
    is assigned per order and is used only to look up customer_unique_id. Location follows the survivorship rule: most recent
    order wins. Facts keep the location at the time of each order through customer_geography_key.'
  columns:
  - name: customer_key
    description: 'Surrogate key (hash of the natural key). ''-1'' = unknown member. Source: Generated: dbt_utils.generate_surrogate_key([''customer_unique_id'']).'
    data_type: varchar(32)
    data_tests:
    - unique
    - not_null
  - name: customer_unique_id
    description: 'Natural (business) key of the customer (anonymized). Source: raw.customers.customer_unique_id'
    data_type: varchar(32)
    data_tests:
    - unique
    - not_null
  - name: customer_zip_code_prefix
    description: '5-character zip prefix from the most recent order. Source: LPAD(TRIM(raw.customers.customer_zip_code_prefix),
      5, ''0'') for the row of the latest order (latest order_purchase_timestamp, tie-break highest order_id).'
    data_type: char(5)
    data_tests:
    - not_null
  - name: customer_city
    description: 'City, normalized (lower case, trimmed, accents removed). Source: raw.customers.customer_city, same survivorship
      row.'
    data_type: varchar(50)
    data_tests:
    - not_null
  - name: customer_state
    description: 'Two-letter state code. Source: UPPER(TRIM(raw.customers.customer_state)), same survivorship row.'
    data_type: char(2)
    data_tests:
    - not_null
  - name: customer_region
    description: 'Brazilian macro-region (Norte, Nordeste, Centro-Oeste, Sudeste, Sul). Hierarchy: region > state > city.
      Source: dbt seed: state -> region.'
    data_type: varchar(15)
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Norte
          - Nordeste
          - Centro-Oeste
          - Sudeste
          - Sul
          - Unknown
  - name: first_order_date
    description: 'Date of the first order (any status). Source: Derived: MIN(raw.orders.order_purchase_timestamp)::date per
      customer_unique_id.'
    data_type: date
    data_tests:
    - not_null
  - name: last_order_date
    description: 'Date of the most recent order (any status). Source: Derived: MAX(raw.orders.order_purchase_timestamp)::date
      per customer_unique_id.'
    data_type: date
    data_tests:
    - not_null
  - name: order_count
    description: 'Number of orders placed (any status). Source: Derived: COUNT(DISTINCT raw.orders.order_id) per customer_unique_id.'
    data_type: int
    data_tests:
    - not_null
  - name: is_repeat_customer
    description: 'TRUE if order_count > 1. Source: Derived from order_count.'
    data_type: boolean
    data_tests:
    - not_null
- name: dim_seller
