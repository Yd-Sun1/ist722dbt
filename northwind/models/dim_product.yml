version: 2

models:
  - name: dim_product
    description: Products. Yida Sun (ysun217).
    columns:
      - name: productkey
        description: Product key.
        tests:
          - not_null
          - unique
      - name: productid
        description: Product ID.
        tests:
          - not_null
          - unique
      - name: productname
        description: Product name.
      - name: supplierkey
        description: Supplier key.
      - name: categoryname
        description: Category name.
        tests:
          - not_null
      - name: categorydescription
        description: Category description.
        tests:
          - not_null
