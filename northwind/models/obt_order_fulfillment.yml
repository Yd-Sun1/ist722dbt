version: 2

models:
  - name: obt_order_fulfillment
    description: Order fulfillment with customer, employee, and order date attributes. One row per order.
    columns:
      - name: customerkey
        description: Customer surrogate key.
      - name: customerid
        description: Customer source key.
      - name: companyname
        description: Customer company name.
      - name: contactname
        description: Customer contact name.
      - name: contacttitle
        description: Customer contact title.
      - name: customeraddress
        description: Customer address.
      - name: customercity
        description: Customer city.
      - name: customerregion
        description: Customer region or state.
      - name: customerpostalcode
        description: Customer postal code.
      - name: customercountry
        description: Customer country.
      - name: customerphone
        description: Customer phone number.
      - name: customerfax
        description: Customer fax number.
      - name: employeekey
        description: Employee surrogate key.
      - name: employeeid
        description: Employee source key.
      - name: employeenamelastfirst
        description: Employee name in last, first order.
      - name: employeenamefirstlast
        description: Employee name in first last order.
      - name: employeetitle
        description: Employee job title.
      - name: supervisornamelastfirst
        description: Supervisor name in last, first order.
      - name: supervisornamefirstlast
        description: Supervisor name in first last order.
      - name: datekey
        description: Date key in YYYYMMDD format.
      - name: date
        description: Calendar date.
      - name: year
        description: Calendar year.
      - name: month
        description: Month number.
      - name: quarter
        description: Quarter number.
      - name: day
        description: Day of the month.
      - name: dayofweek
        description: Day of the week number.
      - name: weekofyear
        description: Week of the year.
      - name: dayofyear
        description: Day of the year.
      - name: quartername
        description: Quarter name.
      - name: monthname
        description: Month name.
      - name: dayname
        description: Day name.
      - name: weekday
        description: Weekday indicator.
      - name: orderid
        description: Order source key and degenerate dimension.
        tests:
          - not_null
          - unique
      - name: orderdatekey
        description: Order date dimension key.
      - name: shippeddatekey
        description: Shipped date dimension key; null when unshipped.
      - name: requireddatekey
        description: Required date dimension key.
      - name: shipname
        description: Shipment recipient name.
      - name: shipaddress
        description: Shipment address.
      - name: shipcity
        description: Shipment city.
      - name: shipregion
        description: Shipment region or state.
      - name: shippostalcode
        description: Shipment postal code.
      - name: shipcountry
        description: Shipment country.
      - name: freight
        description: Shipping cost for the order.
      - name: shipvia
        description: Shipper source key.
      - name: shippercompanyname
        description: Shipper company name.
      - name: quantityonorder
        description: Total product quantity on the order.
      - name: totalorderamount
        description: Total quantity times unit price after discounts.
      - name: daysfromordertoshipped
        description: Days from order date to shipped date.
      - name: daysfromordertorequired
        description: Days from order date to required date.
      - name: shippedtorequireddelta
        description: Days shipped after required date; positive means late.
      - name: shippedontime
        description: Y if shipped by required date, N if late; null when unknown.
