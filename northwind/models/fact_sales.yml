version: 2

models:
  - name: fact_sales
    description: One row per order and product. Yida Sun (ysun217).
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - orderid
            - productkey
    columns:
      - name: orderid
        description: Order ID.
        tests:
          - not_null
      - name: customerkey
        description: Customer key.
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customerkey
      - name: employeekey
        description: Employee key.
        tests:
          - relationships:
              to: ref('dim_employee')
              field: employeekey
      - name: orderdatekey
        description: Order date key.
        tests:
          - relationships:
              to: ref('dim_date')
              field: datekey
      - name: productkey
        description: Product key.
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: productkey
      - name: quantity
        description: Quantity.
        tests:
          - not_null
      - name: extendedpriceamount
        description: Gross amount.
        tests:
          - not_null
      - name: discountamount
        description: Discount amount.
        tests:
          - not_null
      - name: soldamount
        description: Net amount.
        tests:
          - not_null
