version: 2

models:
  - name: fact_order_fulfillment
    description: One row per order. Yida Sun (ysun217).
    columns:
      - name: orderid
        description: Order ID.
        tests:
          - not_null
          - unique
      - name: employeekey
        description: Employee key.
        tests:
          - relationships:
              to: ref('dim_employee')
              field: employeekey
      - name: customerkey
        description: Customer key.
        tests:
          - relationships:
              to: ref('dim_customer')
              field: customerkey
      - name: orderdatekey
        description: Order date key.
        tests:
          - relationships:
              to: ref('dim_date')
              field: datekey
      - name: shippeddatekey
        description: Ship date key.
        tests:
          - relationships:
              to: ref('dim_date')
              field: datekey
      - name: requireddatekey
        description: Required date key.
        tests:
          - relationships:
              to: ref('dim_date')
              field: datekey
      - name: shipname
        description: Recipient.
      - name: shipaddress
        description: Ship address.
      - name: shipcity
        description: Ship city.
      - name: shipregion
        description: Ship region.
      - name: shippostalcode
        description: Ship postal code.
      - name: shipcountry
        description: Ship country.
      - name: freight
        description: Freight.
      - name: shipvia
        description: Shipper ID.
      - name: shippercompanyname
        description: Shipper name.
      - name: quantityonorder
        description: Quantity.
      - name: totalorderamount
        description: Net order total.
      - name: daysfromordertoshipped
        description: Days to ship.
      - name: daysfromordertorequired
        description: Days until required.
      - name: shippedtorequireddelta
        description: Days late.
      - name: shippedontime
        description: On time (Y/N).
