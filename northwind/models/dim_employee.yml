version: 2

models:
  - name: dim_employee
    description: Employees. Yida Sun (ysun217).
    columns:
      - name: employeekey
        description: Employee key.
        tests:
          - not_null
          - unique
      - name: employeeid
        description: Employee ID.
        tests:
          - not_null
          - unique
      - name: employeenamelastfirst
